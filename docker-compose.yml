services:
  postgres:
    image: postgres:16-alpine
    container_name: open_trace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_trace
    ports:
      - "5432:5432"
    volumes:
      - open_trace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_trace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  open_trace_pgdata:
